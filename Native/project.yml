name: SomaNative
options:
  bundleIdPrefix: com.soma
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
packages:
  SomaCore:
    path: SomaCore
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  Soma-iOS:
    type: application
    platform: iOS
    sources: [SomaApp]
    dependencies:
      - package: SomaCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.soma.native.ios
        PRODUCT_NAME: Soma
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Soma
        INFOPLIST_KEY_NSHealthShareUsageDescription: "Soma lit les mesures Santé que vous choisissez afin de préparer leur import et d'en afficher la provenance."
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        CODE_SIGN_ENTITLEMENTS: SomaApp/Health/Soma-iOS.entitlements
        TARGETED_DEVICE_FAMILY: "1"
  Soma-macOS:
    type: application
    platform: macOS
    sources: [SomaApp]
    dependencies:
      - package: SomaCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.soma.native.macos
        PRODUCT_NAME: Soma
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Soma-iOS:
    build:
      targets:
        Soma-iOS: all
    run:
      config: Debug
  Soma-macOS:
    build:
      targets:
        Soma-macOS: all
    run:
      config: Debug
