name: SomaNative
options:
  bundleIdPrefix: com.soma
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
packages:
  SomaCore:
    path: SomaCore
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS.git
    from: 9.0.0
  Supabase:
    url: https://github.com/supabase/supabase-swift.git
    from: 2.55.2
settings:
  base:
    SWIFT_VERSION: "6.0"
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "1.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    SOMA_SUPABASE_URL: https://udqcmptudauxdfkjauad.supabase.co
    SOMA_SUPABASE_PUBLISHABLE_KEY: sb_publishable_HAos_GDaKQmGrj3uLQbMFQ_NY-5oCWY
    GOOGLE_SERVER_CLIENT_ID: 288016413243-pn9btqlc2plgso2fdfbeoi732ultc3kv.apps.googleusercontent.com
    GOOGLE_CLIENT_ID_IOS: 288016413243-a4gao0ki41jn4drs0um2p7bdgr1kmnna.apps.googleusercontent.com
    GOOGLE_REVERSED_CLIENT_ID_IOS: com.googleusercontent.apps.288016413243-a4gao0ki41jn4drs0um2p7bdgr1kmnna
    GOOGLE_CLIENT_ID_MACOS: 288016413243-jh5ivegcm4cc1vq6ajc41rq7e683c4du.apps.googleusercontent.com
    GOOGLE_REVERSED_CLIENT_ID_MACOS: com.googleusercontent.apps.288016413243-jh5ivegcm4cc1vq6ajc41rq7e683c4du
targets:
  Soma-iOS:
    type: application
    platform: iOS
    info:
      path: SomaApp/Info-iOS.plist
      properties:
        CFBundleDisplayName: Soma
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: com.soma.native.ios.oauth
            CFBundleURLSchemes:
              - com.soma.native.ios
          - CFBundleTypeRole: Editor
            CFBundleURLName: com.googleusercontent.apps.soma.ios
            CFBundleURLSchemes:
              - $(GOOGLE_REVERSED_CLIENT_ID_IOS)
        GIDClientID: $(GOOGLE_CLIENT_ID_IOS)
        GIDServerClientID: $(GOOGLE_SERVER_CLIENT_ID)
        SomaSupabaseURL: $(SOMA_SUPABASE_URL)
        SomaSupabasePublishableKey: $(SOMA_SUPABASE_PUBLISHABLE_KEY)
        NSHealthShareUsageDescription: "Soma lit les mesures Santé que vous choisissez afin de préparer leur import et d'en afficher la provenance."
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen: {}
    sources:
      - path: SomaApp
        excludes:
          - Info-iOS.plist
          - Info-macOS.plist
    dependencies:
      - package: SomaCore
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: Supabase
        product: Supabase
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.soma.native.ios
        PRODUCT_NAME: Soma
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: SomaApp/Health/Soma-iOS.entitlements
        TARGETED_DEVICE_FAMILY: "1"
  Soma-macOS:
    type: application
    platform: macOS
    info:
      path: SomaApp/Info-macOS.plist
      properties:
        CFBundleDisplayName: Soma
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: com.soma.native.macos.oauth
            CFBundleURLSchemes:
              - com.soma.native.macos
          - CFBundleTypeRole: Editor
            CFBundleURLName: com.googleusercontent.apps.soma.macos
            CFBundleURLSchemes:
              - $(GOOGLE_REVERSED_CLIENT_ID_MACOS)
        GIDClientID: $(GOOGLE_CLIENT_ID_MACOS)
        GIDServerClientID: $(GOOGLE_SERVER_CLIENT_ID)
        SomaSupabaseURL: $(SOMA_SUPABASE_URL)
        SomaSupabasePublishableKey: $(SOMA_SUPABASE_PUBLISHABLE_KEY)
    sources:
      - path: SomaApp
        excludes:
          - Info-iOS.plist
          - Info-macOS.plist
    dependencies:
      - package: SomaCore
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: Supabase
        product: Supabase
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.soma.native.macos
        PRODUCT_NAME: Soma
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: SomaApp/Soma-macOS.entitlements
schemes:
  Soma-iOS:
    build:
      targets:
        Soma-iOS: all
    run:
      config: Debug
  Soma-macOS:
    build:
      targets:
        Soma-macOS: all
    run:
      config: Debug
