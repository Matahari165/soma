name: SomaNative
options:
  bundleIdPrefix: com.soma
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
packages:
  SomaCore:
    path: SomaCore
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  Soma-iOS:
    type: application
    platform: iOS
    info:
      path: SomaApp/Info-iOS.plist
      properties:
        CFBundleDisplayName: Soma
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: com.soma.native.ios.oauth
            CFBundleURLSchemes:
              - com.soma.native.ios
        NSHealthShareUsageDescription: "Soma lit les mesures Santé que vous choisissez afin de préparer leur import et d'en afficher la provenance."
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen: {}
    sources:
      - path: SomaApp
        excludes:
          - Info-iOS.plist
          - Info-macOS.plist
    dependencies:
      - package: SomaCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.soma.native.ios
        PRODUCT_NAME: Soma
        CODE_SIGN_ENTITLEMENTS: SomaApp/Health/Soma-iOS.entitlements
        TARGETED_DEVICE_FAMILY: "1"
  Soma-macOS:
    type: application
    platform: macOS
    info:
      path: SomaApp/Info-macOS.plist
      properties:
        CFBundleDisplayName: Soma
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: com.soma.native.macos.oauth
            CFBundleURLSchemes:
              - com.soma.native.macos
    sources:
      - path: SomaApp
        excludes:
          - Info-iOS.plist
          - Info-macOS.plist
    dependencies:
      - package: SomaCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.soma.native.macos
        PRODUCT_NAME: Soma
schemes:
  Soma-iOS:
    build:
      targets:
        Soma-iOS: all
    run:
      config: Debug
  Soma-macOS:
    build:
      targets:
        Soma-macOS: all
    run:
      config: Debug
