    </g>
  </g>
  <text x="64" y="330" font-family="Arial" font-size="18" font-weight="700">A · TRIAD PULSE</text>
  <text x="64" y="356" font-family="Arial" font-size="12" fill="#555"><tspan x="64" dy="0">Three synchronized measurements.</tspan><tspan x="64" dy="18">Clear, but too close to a generic waveform.</tspan></text>
  <g transform="translate(445 165)" fill="none" stroke="#111" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
