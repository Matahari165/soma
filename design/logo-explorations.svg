    </g>
  </g>
  <text x="445" y="330" font-family="Arial" font-size="18" font-weight="700">B · SIGNAL PATH</text>
  <text x="445" y="356" font-family="Arial" font-size="12" fill="#555"><tspan x="445" dy="0">A single measured path forming an S.</tspan><tspan x="445" dy="18">Strong, but it does not express multiple signals.</tspan></text>
  <g transform="translate(825 165)" fill="none" stroke="#111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
