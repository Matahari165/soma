<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760">
  <rect width="1200" height="760" fill="#fff"/>
  <g fill="#111" font-family="Arial, sans-serif">
    <text x="64" y="70" font-size="22" font-weight="700" letter-spacing="3">SOMA — VITAL SIGNAL / SYMBOL STUDY</text>
    <text x="64" y="105" font-size="15" fill="#555">Monochrome comparison and small-size legibility test</text>
  </g>
  <g transform="translate(64 165)" fill="none" stroke="#111" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
