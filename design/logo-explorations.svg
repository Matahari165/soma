  <text x="825" y="330" font-family="Arial" font-size="18" font-weight="700">C · PHASE S — SELECTED</text>
  <text x="825" y="356" font-family="Arial" font-size="12" fill="#555"><tspan x="825" dy="0">Three bodily streams converge into one</tspan><tspan x="825" dy="18">readable S-shaped signal.</tspan></text>
